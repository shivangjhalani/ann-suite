name: "Rebuild DiskANN sift10m (forced fresh build)"
description: >-
  The existing indices/DiskANN-R32-Lb50-sift10m directory only contains
  incomplete sharded temp files (no merged ann_disk.index) - the original
  build from ~2026-09-02 never finished. This forces a fresh build with
  reuse_index: false, writing to a new index directory.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 100

algorithms:
  - name: "DiskANN-R32-Lb50-sift10m-rebuilt"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      timeout_seconds: 14400
      reuse_index: false
      args:
        R: 32
        L: 50
        num_threads: 8
        build_memory_maximum: 3.0
        search_memory_maximum: 0.5
    search:
      timeout_seconds: 3600
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        Ls: 100
        beam_width: 2
        num_nodes_to_cache: 0
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
