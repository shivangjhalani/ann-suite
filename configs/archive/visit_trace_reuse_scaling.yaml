name: "Reuse scaling: touched(Q) across query volume - SIFT100M"
description: >-
  Measures how the touched set saturates with query volume, which is the only
  unmeasured input to the cache benefit ceiling in Knowledge/cache-benefit-ceiling:
  ceiling = 1 - 1/(reuse*d), reuse = A*Q/touched(Q).

  At Q=10,000 reuse is 1.076, so a perfect cache is worth 7% of search I/O. But
  108 of each query's 116 accesses land on nodes no other query touches, meaning
  the touched set is far from saturation and reuse must grow with Q. If it grows
  fast, the 7% ceiling is a benchmark artifact and caching is viable at production
  volume; if it does not, caching is a dead end for disk-resident graph ANN.

  Queries are drawn from bigann_learn.bvecs, the standard SIFT1B held-out learn
  set -- same distribution as the base, disjoint from base and from the query set.
  GROUND TRUTH IS A PLACEHOLDER: recall from these runs is meaningless and must be
  discarded. The runs are untimed regardless, since the visit counter adds an
  atomic increment per expanded node.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 200

algorithms:
  - name: "DiskANN-visittrace-sift100m-learn20000"
    docker_image: ann-suite/diskann:visittrace
    algorithm_type: disk
    datasets: [sift100m-learn20000]
    env_vars:
      DISKANN_VISIT_TRACE: "/results/visit_trace_sift100m_learn20000.bin"
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift100m/R32_Lb50_fast"
      required_files: ["ann_disk.index"]
      args: {R: 32, L: 50, num_threads: 8}
    search:
      timeout_seconds: 21600
      k: 10
      batch_mode: false
      args: {num_threads: 8, index_prefix: ann, vector_dtype: uint8, Ls: 100, beam_width: 2, num_nodes_to_cache: 1000}
      warmup: {collect_metrics: true, cache_warmup_queries: 0}

