name: "Page-cache sensitivity - DiskANN vs SPANN SIFT10M"
description: >-
  Tests whether available OS page cache changes disk-resident ANN search cost at
  all, by varying the container memory limit (Docker mem_limit, which caps the
  cgroup's page cache as well as RSS).

  Motivation: source inspection shows BOTH systems open their disk index with
  O_DIRECT -- DiskANN at src/linux_aligned_file_reader.cpp:199
  (O_DIRECT | O_RDONLY | O_LARGEFILE, libaio), SPANN at
  AnnService/src/Core/SPANN/ExtraFileController.cpp:26 (O_RDWR | O_DIRECT).
  Measured DiskANN metrics agree: file_cache_avg_mb stays ~1MB and
  major_faults_per_query is 0.000 across an entire cache sweep.

  If that holds under test, the OS page cache is NOT a usable cache for these
  systems, which means cache population cannot be lazy/demand-filled -- it must
  be eager and explicit, and its cost must be paid up front. That makes the
  population-cost accounting in Results/cache-population-cost-amortization.md
  unavoidable rather than an artifact of one implementation choice.

  This config is therefore a falsification test, not a sweep: a flat response to
  memory_limit is the informative outcome. A non-flat response would mean some
  part of the read path is buffered after all and lazy warming is possible.

  Memory floor is 4g deliberately: measured RSS at zero explicit cache is
  ~2.27GB on SIFT100M, so a 2g limit would OOM before measuring anything.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 50

_anchors:
  diskann_search: &diskann_search
    timeout_seconds: 3600
    k: 10
    batch_mode: false
    args:
      num_threads: 8
      index_prefix: ann
      vector_dtype: float32
      Ls: 100
      beam_width: 2
      num_nodes_to_cache: 0
    warmup:
      collect_metrics: true
      cache_warmup_queries: 0
      drop_caches_before: true
  diskann_build: &diskann_build
    timeout_seconds: 600
    prebuilt_path: "DiskANN-R32-Lb50-sift10m-rebuilt/sift10m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
    required_files: ["ann_disk.index"]
    args: {R: 32, L: 50, num_threads: 8}
  spann_search: &spann_search
    timeout_seconds: 3600
    k: 10
    batch_mode: false
    args:
      internal_result_num: 96
      posting_page_limit: 3
      num_threads: 8
    warmup:
      collect_metrics: true
      cache_warmup_queries: 0
      drop_caches_before: true
  spann_build: &spann_build
    timeout_seconds: 1200
    prebuilt_path: "SPANN/sift10m/internal-result-num-64_max-check-4096_num-thread-9a75424b"

algorithms:
  - name: "DiskANN-sift10m-mem4g"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "4g"
    build: *diskann_build
    search: *diskann_search

  - name: "DiskANN-sift10m-mem8g"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "8g"
    build: *diskann_build
    search: *diskann_search

  - name: "DiskANN-sift10m-mem16g"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "16g"
    build: *diskann_build
    search: *diskann_search

  - name: "DiskANN-sift10m-memfree"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build: *diskann_build
    search: *diskann_search

  - name: "SPANN-sift10m-mem4g"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "4g"
    build: *spann_build
    search: *spann_search

  - name: "SPANN-sift10m-mem8g"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "8g"
    build: *spann_build
    search: *spann_search

  - name: "SPANN-sift10m-mem16g"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "16g"
    build: *spann_build
    search: *spann_search

  - name: "SPANN-sift10m-memfree"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build: *spann_build
    search: *spann_search

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
