name: "Visit distribution capture - SIFT10M and SIFT100M"
description: >-
  Captures the real-workload per-node visit distribution using
  ann-suite/diskann:visittrace, which re-enables DiskANN's own visit counter
  after cache generation so it accumulates over the benchmark's timed query set
  rather than DiskANN's internal sample queries.

  This yields H(N) -- the visit-frequency Lorenz curve -- at every N from a
  single run, instead of one point per benchmark run. Per
  Knowledge/cache-cost-decomposition, H(N) is the only unmodelled term left in
  the cost model, so this is the ground truth everything else needs.

  num_nodes_to_cache is deliberately small (1000). generate_cache_list must run
  for the tracing to arm, but the cache size is otherwise irrelevant here: total
  node accesses per query is exactly invariant to cache size (spread 0.000%
  across three sweeps), so the distribution captured does not depend on it. A
  small cache keeps warmup short.

  NOT A TIMED MEASUREMENT. Counting adds an atomic increment per expanded node.
  Discard the QPS and latency numbers from this run.

  Output is raw little-endian uint32 visit counts indexed by node id, written to
  the mounted results directory: 40MB for SIFT10M, 400MB for SIFT100M.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 200

algorithms:
  - name: "DiskANN-visittrace-sift10m"
    docker_image: ann-suite/diskann:visittrace
    algorithm_type: disk
    datasets: [sift10m]
    env_vars:
      DISKANN_VISIT_TRACE: "/results/visit_trace_sift10m.bin"
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN-R32-Lb50-sift10m-rebuilt/sift10m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
      required_files: ["ann_disk.index"]
      args: {R: 32, L: 50, num_threads: 8}
    search:
      timeout_seconds: 3600
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        vector_dtype: float32
        Ls: 100
        beam_width: 2
        num_nodes_to_cache: 1000
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

  - name: "DiskANN-visittrace-sift100m"
    docker_image: ann-suite/diskann:visittrace
    algorithm_type: disk
    datasets: [sift100m]
    env_vars:
      DISKANN_VISIT_TRACE: "/results/visit_trace_sift100m.bin"
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift100m/R32_Lb50_fast"
      required_files: ["ann_disk.index"]
      args: {R: 32, L: 50, num_threads: 8}
    search:
      timeout_seconds: 5400
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        vector_dtype: uint8
        Ls: 100
        beam_width: 2
        num_nodes_to_cache: 1000
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000

  - name: sift100m
    base_path: sift100m/base.npy
    query_path: sift100m/queries.npy
    ground_truth_path: sift100m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 100000000
    query_count: 10000
