# Reproduces ~/data/build_deg.sh (isfcr benchmark host) + the baseline R=64
# build from ~/data/build10m.sh: a graph-degree sweep on BIGANN-10M,
# R in {32, 64, 128, 256, 512}, L paired per-R exactly as the original
# scripts used (not a cartesian R x L sweep - these are NOT independent
# parameters in the original recipe, so each is its own algorithm entry
# rather than a `build.args.R: [...]` list, which would expand to every
# R x L combination instead of just the 5 intended pairs):
#   R=32  L=128   (build_deg.sh)
#   R=64  L=128   (build10m.sh baseline - already prebuilt at
#                  indices/PipeANN/bigann-10m/R64_L128_pq32/ on isfcr;
#                  included here for completeness/reproducibility)
#   R=128 L=192   (build_deg.sh)
#   R=256 L=320   (build_deg.sh)
#   R=512 L=576   (build_deg.sh)
# pq_bytes=32, build_memory_gb=48, num_threads=24, nbr_type=pq, metric=l2,
# matching build_disk_index's positional args in both source scripts.
#
# Note: build_deg.sh reuses the R=64 run's 1%-sample in-memory entry index
# (`cp idx/bigann10m/idx_mem.index* idx/bigann10m_R$R/`) for every R instead
# of rebuilding it per degree. This config instead rebuilds a fresh
# in-memory index per R (build_mem_index: true, the runner default) - not
# byte-identical to the original artifacts, but built from the same 1%
# sample rate/params, so search-time behavior (mem_L>0) should match
# closely. Set `build_mem_index: false` per entry if byte-identical reuse
# of the original mem index matters for a specific comparison.

name: "PipeANN BIGANN-10M degree sweep"
description: >
  Build PipeANN disk indices at R in {32,64,128,256,512} on BIGANN-10M,
  reproducing the isfcr research host's build_deg.sh + build10m.sh degree
  sweep for latency-under-load experiments.
data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 200

algorithms:
  - name: PipeANN-R32
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 14400
      args:
        index_prefix: pipeann_R32
        R: 32
        L: 128
        pq_bytes: 32
        build_memory_gb: 48
        num_threads: 24
        nbr_type: pq
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: pipeann_R32
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R64
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 14400
      args:
        index_prefix: pipeann_R64
        R: 64
        L: 128
        pq_bytes: 32
        build_memory_gb: 48
        num_threads: 24
        nbr_type: pq
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: pipeann_R64
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R128
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 14400
      args:
        index_prefix: pipeann_R128
        R: 128
        L: 192
        pq_bytes: 32
        build_memory_gb: 48
        num_threads: 24
        nbr_type: pq
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: pipeann_R128
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R256
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 14400
      args:
        index_prefix: pipeann_R256
        R: 256
        L: 320
        pq_bytes: 32
        build_memory_gb: 48
        num_threads: 24
        nbr_type: pq
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: pipeann_R256
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R512
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 14400
      args:
        index_prefix: pipeann_R512
        R: 512
        L: 576
        pq_bytes: 32
        build_memory_gb: 48
        num_threads: 24
        nbr_type: pq
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: pipeann_R512
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

datasets:
  - name: bigann-10m
    base_path: bigann-10m/base10m.u8bin
    query_path: bigann-10m/query.u8bin
    ground_truth_path: bigann-10m/gt10m.bin
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 10000000
    query_count: 10000
