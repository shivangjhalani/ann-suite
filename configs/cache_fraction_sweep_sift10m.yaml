name: "Cache-fraction sweep - DiskANN SIFT10M"
description: >-
  Fine-grained num_nodes_to_cache sweep on the existing DiskANN-R32-Lb50-sift10m
  prebuilt index, holding Ls/beam_width fixed, to characterize how effective
  disk I/O (pages_per_query) and latency/QPS scale with the fraction of the
  graph held in DiskANN's in-memory vertex cache. Feeds the cache-aware I/O
  cost model validation in the ai-researcher project
  (Knowledge/cache-aware-cost-model-validation.md).

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 50

algorithms:
  - name: "DiskANN-cache-sweep-sift10m"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN-R32-Lb50-sift10m-rebuilt/sift10m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
      required_files: ["ann_disk.index"]
      args:
        R: 32
        L: 50
        num_threads: 8
    search:
      timeout_seconds: 3600
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        Ls: 100
        beam_width: 2
      sweep:
        - {num_nodes_to_cache: 0}
        - {num_nodes_to_cache: 1000}
        - {num_nodes_to_cache: 5000}
        - {num_nodes_to_cache: 10000}
        - {num_nodes_to_cache: 50000}
        - {num_nodes_to_cache: 100000}
        - {num_nodes_to_cache: 250000}
        - {num_nodes_to_cache: 500000}
        - {num_nodes_to_cache: 1000000}
        - {num_nodes_to_cache: 2500000}
        - {num_nodes_to_cache: 5000000}
        - {num_nodes_to_cache: 10000000}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
