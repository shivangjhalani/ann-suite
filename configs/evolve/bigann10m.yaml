# Evolution setup: OpenEvolve candidates (library/algorithms/evolved) scored in
# ann-suite against the frontier of published disk-ANN systems on BIGANN-10M.
# Used by tools/evolve/evolve_bench.py; see docs/EVOLVE.md.
#
# Data: BIGANN (SIFT1B) 10M prefix, uint8, first 2000 of the 10k public queries.
# The candidate data dir holds base.npy + queries.npy only; ground truth stays in
# /home/isfcr/data and is read only by the host-side scorer.

name: evolve-bigann10m
data_dir: /home/isfcr/evolve_data          # mounted into candidate containers
index_dir: /home/isfcr/evolve_indices
results_dir: ./results/evolve
programs_subdir: programs                  # <data_dir>/programs/<id>.py
image: ann-suite/evolved:latest
k: 10
# DRAM budget: 0.5x the raw dataset (640 MB) above the harness runtime floor
# (~86 MB: runner + sandboxed candidate process, results/evolve/floors.json),
# which is subtracted before scoring. The budget is enforced by the scoring (a
# point above 640 MB + margin lands in no budget cell); the container limit
# leaves headroom so library code pages are not evicted and re-read during the
# queries, which would inflate the kernel I/O count. Page cache cannot be used as
# hidden DRAM: the runner fails a point whose page cache grows during the
# queries. Builds are not capped.
memory_limit: 1g
build_threads: 16
search_threads: 1
monitor_interval_ms: 100
cache:
  max_gb: 150                              # LRU budget for cached candidate indices

stages:
  sanity:                                  # unscored gate: does it work at all?
    dataset: bigann1m-q1k
    base_count: 1000000
    query_count: 1000
    ground_truth: /home/isfcr/data/bigann1m-q1k/ground_truth.npy
    build_timeout_s: 1200
    search_timeout_s: 900
    min_recall: 0.5
  full:                                    # scored
    dataset: bigann10m-q2k
    base_count: 10000000
    query_count: 2000
    ground_truth: /home/isfcr/data/bigann10m-q2k/ground_truth.npy
    build_timeout_s: 3600
    search_timeout_s: 1800
    scored: true
  hidden:                                  # validation only: queries 2000-3999
    dataset: bigann10m-hidden
    base_count: 10000000
    query_count: 2000
    ground_truth: /home/isfcr/data/bigann10m-hidden/ground_truth.npy
    build_from: full                       # same base vectors: reuse the full build
    build_timeout_s: 3600
    search_timeout_s: 1800
    scored: true
  # Held-out re-checks for top programs (not used during evolution; unscored):
  #   evolve_bench.py candidate prog.py --id X --stages heldout_deep,heldout_t2i
  # Sets built by tools/evolve/make_heldout.py.
  heldout_deep:
    dataset: deep10m-q2k
    base_count: 10000000
    query_count: 2000
    dimension: 96
    point_type: float32
    metric: L2
    ground_truth: /home/isfcr/data/deep10m-q2k/ground_truth.npy
    build_timeout_s: 5400
    search_timeout_s: 1800
  heldout_t2i:
    dataset: t2i10m-q2k
    base_count: 10000000
    query_count: 2000
    dimension: 200
    point_type: float32
    metric: IP
    ground_truth: /home/isfcr/data/t2i10m-q2k/ground_truth.npy
    build_timeout_s: 7200
    search_timeout_s: 1800

# Baseline frontier, produced by `evolve_bench.py baselines` from
# configs/evolve/baselines_bigann10m.yaml.
frontier: results/evolve/frontier_bigann10m_q2k.json
floors: results/evolve/floors.json

# Scoring (tools/evolve/frontier.py): budget cells, big-ann-benchmarks style. In
# each (DRAM budget, recall target) cell, gain = log2(best baseline pages/query /
# candidate pages/query); score = best gain over cells that have a baseline.
# Cells with no baseline give no credit and are reported as uncovered.
score:
  dram_tiers_mb: [32, 128, 640]
  recall_targets: [0.90, 0.95]
  # Peak-DRAM jitter of a repeated run was 3-6 MB: candidates are charged and
  # baselines credited this much when placed into a budget.
  dram_margin_mb: 6
# A would-be record is re-measured on the same queries and on hidden ones; the
# minimum of the three scores counts (see evolve_bench.py).
validation:
  stages: [full, hidden]
guardrails:
  max_search_points: 8
  max_cpu_ms_per_query: 200          # Python, single thread; generous on purpose
  io_crosscheck_ratio: 1.25          # kernel pages/query may exceed harness pages/query
  io_crosscheck_slack_pages: 1       #   by at most ratio * harness + slack; scored
                                     #   pages = max(harness, kernel - slack). The kernel
                                     #   count is read by the runner over exactly the
                                     #   query loop and matched the harness within 0.05.
  max_rounds_per_query: 64           # ~DiskANN's hops at recall 0.9; each round = one SSD wait
  max_index_gb: 10.24                # 8x the raw vectors

# Images whose runtime floor (Python + imports, idle) is subtracted from their
# measured search peak anonymous memory.
floor_images:
  ann-suite/diskann:latest: "import numpy, diskannpy"
  ann-suite/pipeann:latest: "import numpy"
  ann-suite/spann:latest: "import numpy"
  ann-suite/starling:latest: "import numpy"
  ann-suite/pageann:latest: "import numpy"
