# Held-out dataset for the analysis paper (A1/A2 replication): DiskANN, PipeANN and LAANN
# on DEEP-10M (96-d float32, L2), first 2000 queries, with the build parameters of
# diskann.yaml / pipeann.yaml / pageann.yaml. Starling on DEEP-10M is in starling_heldout.yaml.
#   uv run python tools/evolve/e2e/run_baselines_e2e.py configs/evolve/baselines/heldout_deep.yaml \
#       --threads 8 --out heldout-deep-t8 --build
name: "heldout-deep"
data_dir: "/home/isfcr/data"
results_dir: "./results/evolve/baselines"
index_dir: "/home/isfcr/evolve_indices/baselines"
monitor_interval_ms: 100
resources:
  memory_limit: "785m"
  cpu_affinity: "0-7"
datasets:
  - name: deep10m-q2k
    base_path: deep10m-q2k/base.npy
    query_path: deep10m-q2k/queries.npy
    ground_truth_path: deep10m-q2k/ground_truth.npy
    distance_metric: L2
    dimension: 96
    point_type: float32
    base_count: 10000000
    query_count: 2000
x-build: &build
  timeout_seconds: 21600
  memory_limit: none
  cpu_affinity: none   # pin searches only; builds use all cores
algorithms:
  - name: DiskANN-B0.32-deep
    x-system: DiskANN
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [deep10m-q2k]
    build: {<<: *build, probe_file: "*_disk.index", args: {R: 64, L: 128, search_memory_maximum: 0.32, build_memory_maximum: 16, num_threads: 24}}
    search:
      timeout_seconds: 1800
      k: 10
      batch_mode: false
      args: {num_threads: 8, index_prefix: ann, num_nodes_to_cache: 0, beam_width: 4, vector_dtype: float32}
      sweep: [{Ls: 15}, {Ls: 25}, {Ls: 40}, {Ls: 60}, {Ls: 100}]
  - name: PipeANN-pq32-deep
    x-system: PipeANN
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [deep10m-q2k]
    build: {<<: *build, probe_file: "*_disk.index", args: {index_prefix: pipeann, R: 64, L: 128, pq_bytes: 32, build_memory_gb: 16, num_threads: 24, nbr_type: pq, build_mem_index: true}}
    search:
      timeout_seconds: 1800
      k: 10
      batch_mode: false
      args: {index_prefix: pipeann, mem_L: 10, num_threads: 8}
      sweep: [{mode: 2, beam_width: 32, Ls: 15}, {mode: 2, beam_width: 32, Ls: 25}, {mode: 2, beam_width: 32, Ls: 40}, {mode: 2, beam_width: 32, Ls: 60}, {mode: 2, beam_width: 32, Ls: 100}]
  - name: LAANN-B0.32-deep
    x-system: LAANN
    docker_image: ann-suite/pageann:latest
    algorithm_type: disk
    datasets: [deep10m-q2k]
    build: {<<: *build, probe_file: "*_fsort.index", args: {variant: laann, R: 48, L: 128, B: 0.32, M: 16, num_threads: 12}}
    search:
      timeout_seconds: 1800
      k: 10
      batch_mode: false
      args: {num_threads: 8, beam_width: 5, nav_L: 100}
      sweep: [{Ls: 15, cache_ratio: 0.0}, {Ls: 25, cache_ratio: 0.0}, {Ls: 40, cache_ratio: 0.0}, {Ls: 60, cache_ratio: 0.0}, {Ls: 100, cache_ratio: 0.0}]
