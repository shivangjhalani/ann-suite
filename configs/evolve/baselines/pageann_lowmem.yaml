# Frontier baseline: PageANN in its low-memory mode (arXiv:2509.25487): PQ codes
# of rarely referenced neighbors stored inline in the pages, only mem_budget_gb of
# hot neighbors' PQ cached in DRAM, and a navigation graph over a sample of pages.
# PQ size stays at B = 0.32 (34 B/vector) while DRAM is set by the budget.
# Run: uv run python tools/evolve/evolve_bench.py baselines configs/evolve/baselines/pageann_lowmem.yaml
name: "frontier-pageann-lowmem-bigann10m"
data_dir: "/home/isfcr/data"
results_dir: "./results/evolve/baselines"
index_dir: "/home/isfcr/evolve_indices/baselines"
monitor_interval_ms: 100
# Same search DRAM cap and pinned cores as the evolved candidates (configs/evolve/bigann10m.yaml).
resources:
  memory_limit: "785m"
  cpu_affinity: "0-7"
datasets:
  - name: bigann10m-q2k
    base_path: bigann10m-q2k/base.npy
    query_path: bigann10m-q2k/queries.npy
    ground_truth_path: bigann10m-q2k/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 10000000
    query_count: 2000
x-search: &search
  timeout_seconds: 1800
  k: 10
  batch_mode: false
  args: {num_threads: 8, beam_width: 5, nav_L: 10, cache_ratio: 0.0}
  sweep: [{Ls: 15}, {Ls: 25}, {Ls: 40}, {Ls: 60}, {Ls: 100}, {Ls: 160}, {Ls: 250}]
algorithms:
  - name: PageANN-mem0.03-nav50k
    x-system: PageANN
    docker_image: ann-suite/pageann:latest
    algorithm_type: disk
    datasets: [bigann10m-q2k]
    build:
      timeout_seconds: 21600
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {variant: pageann, R: 48, L: 128, B: 0.32, mem_budget_gb: 0.03, nav_sampled_pages: 50000, M: 16, num_threads: 24}
    search: *search
  - name: PageANN-mem0.15-nav200k
    x-system: PageANN
    docker_image: ann-suite/pageann:latest
    algorithm_type: disk
    datasets: [bigann10m-q2k]
    build:
      timeout_seconds: 21600
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {variant: pageann, R: 48, L: 128, B: 0.32, mem_budget_gb: 0.15, nav_sampled_pages: 200000, M: 16, num_threads: 24}
    search: *search
