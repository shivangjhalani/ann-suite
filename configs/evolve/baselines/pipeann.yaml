# Frontier baseline: PipeANN on BIGANN-10M, first 2000 queries. Both its pipelined
# search (mode 2) and DiskANN-style beam search with its in-memory entry index
# (mode 0, W=4) are frontier candidates.
# Run: uv run python tools/evolve/evolve_bench.py baselines configs/evolve/baselines/pipeann.yaml
name: "frontier-pipeann-bigann10m"
data_dir: "/home/isfcr/data"
results_dir: "./results/evolve/baselines"
index_dir: "/home/isfcr/evolve_indices/baselines"
monitor_interval_ms: 100
# Same search DRAM cap and pinned cores as the evolved candidates (configs/evolve/bigann10m.yaml).
resources:
  memory_limit: "785m"
  cpu_affinity: "0-7"
datasets:
  - name: bigann10m-q2k
    base_path: bigann10m-q2k/base.npy
    query_path: bigann10m-q2k/queries.npy
    ground_truth_path: bigann10m-q2k/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 10000000
    query_count: 2000
x-search: &search
  timeout_seconds: 1800
  k: 10
  batch_mode: false
  args: {index_prefix: pipeann, mem_L: 10, num_threads: 8}
  sweep:
    - {mode: 2, beam_width: 32, Ls: 15}
    - {mode: 2, beam_width: 32, Ls: 25}
    - {mode: 2, beam_width: 32, Ls: 40}
    - {mode: 2, beam_width: 32, Ls: 60}
    - {mode: 2, beam_width: 32, Ls: 100}
    - {mode: 2, beam_width: 32, Ls: 160}
    - {mode: 0, beam_width: 4, Ls: 15}
    - {mode: 0, beam_width: 4, Ls: 25}
    - {mode: 0, beam_width: 4, Ls: 40}
    - {mode: 0, beam_width: 4, Ls: 60}
    - {mode: 0, beam_width: 4, Ls: 100}
    - {mode: 0, beam_width: 4, Ls: 160}
algorithms:
  - name: PipeANN-pq10
    x-system: PipeANN
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann10m-q2k]
    build:
      timeout_seconds: 14400
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {index_prefix: pipeann, R: 64, L: 128, pq_bytes: 10, build_memory_gb: 16, num_threads: 24, nbr_type: pq, build_mem_index: true}
    search: *search
  - name: PipeANN-pq32
    x-system: PipeANN
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann10m-q2k]
    build:
      timeout_seconds: 14400
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {index_prefix: pipeann, R: 64, L: 128, pq_bytes: 32, build_memory_gb: 16, num_threads: 24, nbr_type: pq, build_mem_index: true}
    search: *search
