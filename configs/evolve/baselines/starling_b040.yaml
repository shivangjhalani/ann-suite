# Frontier baseline: Starling at B=0.40 (40 B PQ per vector), the DRAM of the
# 40 B fast-scan + refinement design (tools/evolve/ablation/abl_fastscan_h40.py),
# for a matched-memory comparison. Otherwise as starling.yaml.
# Run: uv run python tools/evolve/evolve_bench.py baselines configs/evolve/baselines/starling_b040.yaml
name: "frontier-starling-b040-bigann10m"
data_dir: "/home/isfcr/data"
results_dir: "./results/evolve/baselines"
index_dir: "/home/isfcr/evolve_indices/baselines"
monitor_interval_ms: 100
# Same search DRAM cap and pinned cores as the evolved candidates (configs/evolve/bigann10m.yaml).
resources:
  memory_limit: "785m"
  cpu_affinity: "0-7"
datasets:
  - name: bigann10m-q2k
    base_path: bigann10m-q2k/base.npy
    query_path: bigann10m-q2k/queries.npy
    ground_truth_path: bigann10m-q2k/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 10000000
    query_count: 2000
x-search: &search
  timeout_seconds: 1800
  k: 10
  batch_mode: false
  args: {num_threads: 8, beam_width: 4, mem_L: 10, use_ratio: 1.0, num_nodes_to_cache: 0}
  sweep: [{Ls: 15}, {Ls: 25}, {Ls: 40}, {Ls: 60}, {Ls: 100}, {Ls: 160}, {Ls: 250}]
algorithms:
  - name: Starling-B0.40
    x-system: Starling
    docker_image: ann-suite/starling:latest
    algorithm_type: disk
    datasets: [bigann10m-q2k]
    build:
      timeout_seconds: 21600
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {R: 48, L: 128, B: 0.40, M: 16, num_threads: 24, build_mem_index: true}
    search: *search
