# 100M scale baseline: Starling on BIGANN-100M at B=4.0 (40 B PQ per vector, the same
# bytes per vector as design v2, tools/evolve/ablation/abl_v2.py), i.e. the 10M
# matched-DRAM comparison (starling_b040.yaml) scaled by 10x. Search cap 8g as the
# scale100m stage of configs/evolve/bigann10m.yaml. Data: make_heldout.py bigann100m-q2k.
# Build: uv run python tools/evolve/e2e/run_baselines_e2e.py configs/evolve/baselines/starling_100m.yaml --build --threads 1 --out s100m-build-discard
name: "scale-starling-bigann100m"
data_dir: "/home/isfcr/data"
results_dir: "./results/evolve/baselines"
index_dir: "/home/isfcr/evolve_indices/baselines"
monitor_interval_ms: 100
resources:
  memory_limit: "8g"
  cpu_affinity: "0-7"
datasets:
  - name: bigann100m-q2k
    base_path: bigann100m-q2k/base.npy
    query_path: bigann100m-q2k/queries.npy
    ground_truth_path: bigann100m-q2k/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 100000000
    query_count: 2000
x-search: &search
  timeout_seconds: 3600
  k: 10
  batch_mode: false
  args: {num_threads: 8, beam_width: 4, mem_L: 10, use_ratio: 1.0, num_nodes_to_cache: 0}
  sweep: [{Ls: 15}, {Ls: 20}, {Ls: 25}, {Ls: 30}, {Ls: 40}, {Ls: 60}, {Ls: 100}]
algorithms:
  - name: Starling-B4.0-100m
    x-system: Starling
    docker_image: ann-suite/starling:latest
    algorithm_type: disk
    datasets: [bigann100m-q2k]
    build:
      timeout_seconds: 86400
      memory_limit: none
      cpu_affinity: none   # pin searches only; builds use all cores
      args: {R: 48, L: 128, B: 4.0, M: 40, num_threads: 24, build_mem_index: true}
    search: *search
