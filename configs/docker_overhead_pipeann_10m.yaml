# The "ann-suite (Docker)" arm of the PipeANN Docker-overhead check, through the real
# `ann-suite run` path (container_runner + cgroup monitoring), not a raw `docker run`.
# Index: PipeANN R=64/L=128/pq=32 on BIGANN-10M, built by tools/docker_overhead/run_pipeann_spann.py.
# Compare with the native arm (tools/docker_overhead/diag_state.py) in the SAME device state: the
# per-point probe_* columns (cond_probe_qd1_p50_us) show whether the SSD state matched.

name: "docker-overhead-pipeann-10m"
description: "PipeANN BIGANN-10M search inside ann-suite, for comparison with native runs."

data_dir: "/home/isfcr/data"
results_dir: "./results"
index_dir: "./indices"

resources:
  cpu_affinity: "0-7"

algorithms:
  - name: PipeANN
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    build:
      prebuilt_path: "/home/isfcr/shivang/ann-suite/.native/indices/pipeann/bigann10m"
      required_files: ["pipeann_disk.index", "pipeann_pq_compressed.bin"]
    search:
      timeout_seconds: 1800
      k: 10
      sweep: [{Ls: 20}, {Ls: 50}, {Ls: 100}, {Ls: 150}]
      args: {index_prefix: pipeann, mode: 2, beam_width: 32, nbr_type: pq, num_threads: 8}

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
