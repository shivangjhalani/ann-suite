name: "Per-query co-visitation trace - SIFT100M and SIFT10M"
description: >-
  Captures which nodes are expanded BY THE SAME QUERY, using
  ann-suite/diskann:covisit (visittrace + covisit_trace.patch).

  Aggregated visit counts give H(N) but cannot answer how few pages a query could
  touch under a better layout, because that depends on co-visitation rather than
  per-node frequency. Per Knowledge/cache-benefit-ceiling, d -- useful nodes per
  page read -- is the only term with real headroom left, and d is exactly what
  co-visitation bounds.

  Output: [uint32 n][n x uint32 node_id] per query, appended, read to EOF.
  Roughly 116 ids per query on SIFT100M, so ~4.6 MB for 10,000 queries.

  NOT A TIMED MEASUREMENT -- a push_back per expanded node and a locked write per
  query. Discard QPS and latency.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 200

algorithms:
  - name: "DiskANN-covisit-sift100m"
    docker_image: ann-suite/diskann:covisit
    algorithm_type: disk
    datasets: [sift100m]
    env_vars:
      DISKANN_COVISIT_TRACE: "/results/covisit_sift100m.bin"
      DISKANN_VISIT_TRACE: "/results/visit_trace_sift100m_covisitrun.bin"
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift100m/R32_Lb50_fast"
      required_files: ["ann_disk.index"]
      args: {R: 32, L: 50, num_threads: 8}
    search:
      timeout_seconds: 5400
      k: 10
      batch_mode: false
      args: {num_threads: 8, index_prefix: ann, vector_dtype: uint8, Ls: 100, beam_width: 2, num_nodes_to_cache: 1000}
      warmup: {collect_metrics: true, cache_warmup_queries: 0}

datasets:
  - name: sift100m
    base_path: sift100m/base.npy
    query_path: sift100m/queries.npy
    ground_truth_path: sift100m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 100000000
    query_count: 10000
