name: "Cache population cost - SIFT100M hashfix fine-grained"
description: >-
  Measures cache *population* cost (warmup) as a first-class metric, using the
  ann-suite/diskann:hashfix image so the robin_map id-space-folding pathology is
  removed and any remaining structure in the warmup curve is real.

  Cache sizes are chosen to bracket 2,781,781 -- the number of nodes DiskANN's
  generate_cache_list_from_sample_queries actually visits on this index. Below
  that boundary the cache is populated from nodes the sample pass already
  touched (so plausibly still page-cache resident); above it, DiskANN pads the
  cache list with zero-visit filler nodes that must be read cold from disk.
  The open question is whether per-node population cost steps at that boundary.

  Search parameters match cache_fraction_sweep_sift100m_matched.yaml exactly so
  the four overlapping points (1M, 5M, 10M, 25M) form a clean A/B against the
  ann-suite/diskann:latest baseline already collected.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 100

algorithms:
  - name: "DiskANN-hashfix-population-sweep"
    docker_image: ann-suite/diskann:hashfix
    algorithm_type: disk
    datasets: [sift100m]
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift100m/R32_Lb50_fast"
      required_files: ["ann_disk.index"]
      args:
        R: 32
        L: 50
        num_threads: 8
    search:
      timeout_seconds: 5400
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        vector_dtype: uint8
        Ls: 100
        beam_width: 2
      sweep:
        - {num_nodes_to_cache: 0}
        - {num_nodes_to_cache: 1000000}
        - {num_nodes_to_cache: 2000000}
        - {num_nodes_to_cache: 2500000}
        - {num_nodes_to_cache: 2800000}
        - {num_nodes_to_cache: 3500000}
        - {num_nodes_to_cache: 5000000}
        - {num_nodes_to_cache: 10000000}
        - {num_nodes_to_cache: 25000000}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

datasets:
  - name: sift100m
    base_path: sift100m/queries.npy
    query_path: sift100m/queries.npy
    ground_truth_path: sift100m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 100000000
    query_count: 10000
