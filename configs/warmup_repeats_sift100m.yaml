name: "Warmup repeats - SIFT100M hashfix"
description: >-
  Cache population time (time_warmup_duration_seconds) became a first-class
  metric in Results/cache-population-cost-amortization.md, but every value it
  was computed from is a single measurement. This repeats representative cache
  sizes to get error bars.

  Duplicate sweep entries are preserved by evaluator.search_sweep_params (it
  copies the list without deduplicating), so repeated entries run as independent
  points.

  Point selection is weighted by cost: the cheap points repeat 3x, the expensive
  ones fewer, since a single 25M warmup is ~35 minutes. 5,000,000 is included at
  3x specifically because it was the worst-contaminated point under the hash bug
  and its post-fix variance is load-bearing for the break-even curve.

  Runs on :hashfix so these double as additional fixed-build data points.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 100

algorithms:
  - name: "DiskANN-hashfix-warmup-repeats"
    docker_image: ann-suite/diskann:hashfix
    algorithm_type: disk
    datasets: [sift100m]
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift100m/R32_Lb50_fast"
      required_files: ["ann_disk.index"]
      args:
        R: 32
        L: 50
        num_threads: 8
    search:
      timeout_seconds: 5400
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        vector_dtype: uint8
        Ls: 100
        beam_width: 2
      sweep:
        - {num_nodes_to_cache: 0}
        - {num_nodes_to_cache: 0}
        - {num_nodes_to_cache: 0}
        - {num_nodes_to_cache: 100000}
        - {num_nodes_to_cache: 100000}
        - {num_nodes_to_cache: 100000}
        - {num_nodes_to_cache: 1000000}
        - {num_nodes_to_cache: 1000000}
        - {num_nodes_to_cache: 1000000}
        - {num_nodes_to_cache: 5000000}
        - {num_nodes_to_cache: 5000000}
        - {num_nodes_to_cache: 5000000}
        - {num_nodes_to_cache: 25000000}
        - {num_nodes_to_cache: 25000000}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0

datasets:
  - name: sift100m
    base_path: sift100m/base.npy
    query_path: sift100m/queries.npy
    ground_truth_path: sift100m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 100000000
    query_count: 10000
