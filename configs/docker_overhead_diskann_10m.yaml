# The "ann-suite (Docker)" arm of the Docker-overhead check. tools/docker_overhead/run.py
# runs this config once per repeat, interleaved with the same runner outside Docker
# and with native C++ search_disk_index, all on the same prebuilt index, the same
# queries, the same P-cores (0-7) and a dropped page cache before every point.
# Index: DiskANN C++ (same commit as the image) R=100 L=100 PQ M=32 on BIGANN-10M uint8,
# built by ~/diskann/benchmark on the isfcr host.

name: "docker-overhead-diskann-10m"
description: "DiskANN BIGANN-10M search inside ann-suite, for comparison with native runs."

data_dir: "/home/isfcr/data"
results_dir: "./results"
index_dir: "./indices"

resources:
  cpu_affinity: "0-7"

x-search: &search
  timeout_seconds: 1800
  k: 10
  batch_mode: true
  sweep: [{Ls: 10}, {Ls: 20}, {Ls: 30}, {Ls: 50}, {Ls: 100}, {Ls: 200}]

x-build: &build
  prebuilt_path: "/home/isfcr/diskann/datasets/sift10m"
  required_files: ["disk_index_disk.index", "disk_index_pq_compressed.bin"]

algorithms:
  - name: DiskANN-T1
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    build: *build
    search:
      <<: *search
      args: {num_threads: 1, index_prefix: disk_index, vector_dtype: uint8, beam_width: 2, num_nodes_to_cache: 0}

  - name: DiskANN-T8
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    build: *build
    search:
      <<: *search
      args: {num_threads: 8, index_prefix: disk_index, vector_dtype: uint8, beam_width: 2, num_nodes_to_cache: 0}

datasets:
  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
