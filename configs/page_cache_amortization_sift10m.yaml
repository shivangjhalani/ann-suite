name: "Page-cache amortization - DiskANN vs SPANN SIFT10M"
description: >-
  Algorithm-agnostic test of whether the cache-size/search-cost relationship
  measured via DiskANN's explicit node cache also holds for the OS page cache,
  which every disk-resident ANN system depends on regardless of its internal
  design.

  Varies the container memory limit (Docker mem_limit, which caps the cgroup's
  page cache as well as RSS) instead of any algorithm-specific cache parameter.
  DiskANN runs with num_nodes_to_cache=0 so its explicit cache is entirely out
  of the picture and the page cache is the only cache present. SPANN has no
  comparable tunable node cache at all, which is exactly why it is the useful
  second algorithm here -- if the same shape appears, the effect is a property
  of disk-resident search rather than of DiskANN's cache implementation.

  This also contrasts two population regimes: DiskANN's explicit cache is
  populated EAGERLY in a separate warmup phase (paid up front, measured
  directly), while the page cache fills LAZILY during querying (paid inside the
  query stream). Latency percentiles are the observable -- lazy population
  should widen the p50/p99 gap because early queries miss and late ones hit.

  drop_caches_before ensures each run starts from a genuinely cold page cache;
  without it the previous run's residency leaks into the next measurement.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 50

algorithms:
  - name: "DiskANN-sift10m-mem2g"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "2g"
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN-R32-Lb50-sift10m-rebuilt/sift10m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
      required_files: ["ann_disk.index"]
      args: {R: 32, L: 50, num_threads: 8}
    search: &diskann_search
      timeout_seconds: 3600
      k: 10
      batch_mode: false
      args:
        num_threads: 8
        index_prefix: ann
        vector_dtype: float32
        Ls: 100
        beam_width: 2
        num_nodes_to_cache: 0
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0
        drop_caches_before: true

  - name: "DiskANN-sift10m-mem4g"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    memory_limit: "4g"
