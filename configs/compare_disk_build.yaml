# Step 1 of the memory-matched DiskANN vs SPANN comparison: build each index once,
# with no memory cap. Step 2 (compare_disk_memory_budgets.yaml) searches these
# indices under 2/4/8 GB budgets via build.prebuilt_path. The index directories
# are named by build_combo_slug(build.args), so keep the args here and the
# prebuilt paths in step 2 in sync.

name: "compare-disk-build"
description: "Build DiskANN (R32/L50) and SPANN indices on SIFT1M and SIFT10M for the budget comparison."

data_dir: "/home/isfcr/data"
results_dir: "./results"
index_dir: "./indices"

algorithms:
  - name: DiskANN-R32-L50
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    build:
      timeout_seconds: 14400
      args:
        R: 32
        L: 50
        num_threads: 8
        build_memory_maximum: 3.0
        search_memory_maximum: 0.5
    search:
      k: 10
      args: {num_threads: 8, index_prefix: ann, num_nodes_to_cache: 0, beam_width: 2, Ls: 100}

  - name: SPANN
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    build:
      timeout_seconds: 14400
      args:
        num_threads: 16
        max_check: 4096
        posting_page_limit: 3
        internal_result_num: 64
    search:
      k: 10
      args: {internal_result_num: 96, posting_page_limit: 3, num_threads: 8}

datasets:
  - name: sift1m
    base_path: sift1m/base.npy
    query_path: sift1m/queries.npy
    ground_truth_path: sift1m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 1000000
    query_count: 10000

  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
