# Step 2 of the memory-matched DiskANN vs SPANN comparison (run
# compare_disk_build.yaml first). Every algorithm searches its prebuilt index under
# the same DRAM budget and the same pinned cores; the budget list expands each entry
# into <name>@2g, <name>@4g, <name>@8g. The cgroup memory limit counts page cache,
# so it bounds how much of each index can stay in RAM. Compare recall-vs-QPS curves
# only within one budget.
#
# Search knobs swept per family:
#   DiskANN  Ls in {50, 100, 200, 400, 800}, beam_width 2, no node cache
#   SPANN    internal_result_num in {32, 64, 96, 160, 256}, posting_page_limit 3

name: "compare-disk-memory-budgets"
description: "DiskANN vs SPANN on SIFT1M/SIFT10M at 2/4/8 GB DRAM budgets, 8 pinned cores, cold page cache."

data_dir: "/home/isfcr/data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 50

resources:
  memory_limit: ["2g", "4g", "8g"]
  cpu_affinity: "0-7"

x-diskann-search: &diskann_search
  timeout_seconds: 7200
  k: 10
  batch_mode: false
  args: {num_threads: 8, index_prefix: ann, num_nodes_to_cache: 0, beam_width: 2}
  sweep: [{Ls: 50}, {Ls: 100}, {Ls: 200}, {Ls: 400}, {Ls: 800}]

x-spann-search: &spann_search
  timeout_seconds: 7200
  k: 10
  batch_mode: false
  args: {posting_page_limit: 3, num_threads: 8}
  sweep:
    - {internal_result_num: 32}
    - {internal_result_num: 64}
    - {internal_result_num: 96}
    - {internal_result_num: 160}
    - {internal_result_num: 256}

algorithms:
  - name: DiskANN-R32-L50-sift1m
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift1m]
    build:
      prebuilt_path: "DiskANN-R32-L50/sift1m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
      required_files: ["ann_disk.index"]
    search: *diskann_search

  - name: DiskANN-R32-L50-sift10m
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      prebuilt_path: "DiskANN-R32-L50/sift10m/L-50_R-32_build-memory-maximum-3-0_num-threads-8-c105d7f6"
      required_files: ["ann_disk.index"]
    search: *diskann_search

  - name: SPANN-sift1m
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift1m]
    build:
      prebuilt_path: "SPANN/sift1m/internal-result-num-64_max-check-4096_num-thread-9a75424b"
    search: *spann_search

  - name: SPANN-sift10m
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      prebuilt_path: "SPANN/sift10m/internal-result-num-64_max-check-4096_num-thread-9a75424b"
    search: *spann_search

datasets:
  - name: sift1m
    base_path: sift1m/base.npy
    query_path: sift1m/queries.npy
    ground_truth_path: sift1m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 1000000
    query_count: 10000

  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000
