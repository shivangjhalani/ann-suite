# ==============================================================================
# DiskANN vs SPANN — Comparable Search Sweep (SIFT1M / SIFT10M)
# ==============================================================================
# Goal: directly comparable *search-only* measurements for the two disk-based
# algorithms under identical conditions so the recall-vs-QPS tradeoff curves can
# be fairly overlaid.
#
# Comparability guarantees:
#   - Same datasets (sift1m, sift10m; BIGANN SIFT prefixes, 128-d float32),
#     same 10,000 query vectors and the same restricted ground truth for BOTH
#     algorithms on each dataset (recall@10 computed identically).
#   - No batching: batch_mode=false everywhere → real per-query latency.
#   - Whole machine: no cpu_limit / memory_limit / cpu_affinity; both algorithms
#     default to all 8 logical CPUs for search.
#   - Same warmup semantics: drop_caches_before=true (cold-start search), zero
#     warmup queries for both algorithms. If cache drop requires root/sudo and
#     fails, the suite logs a warning and runs warm instead.
#   - Index parity on search knobs:
#       DiskANN sweep  Ls ∈ {50, 100, 200, 400, 800}, beam_width fixed 2,
#                      num_nodes_to_cache 0.
#       SPANN   sweep  internal_result_num ∈ {32, 64, 96, 160, 256},
#                      posting_page_limit fixed 3.
#
# Indexes:
#   - SPANN sift1m/sift10m : prebuilt (indices/SPANN/...)           → prebuilt_path
#   - DiskANN sift1m       : prebuilt uint8 texmex index (R32/L50)   → prebuilt_path
#   - DiskANN sift10m      : no prebuilt present                     → built now (R32/L50)
#
# Build metrics are reported but not the focus; index build is skipped wherever
# a prebuilt index exists, and built exactly once (reuse_index) for sift10m.
# ==============================================================================

name: "DiskANN vs SPANN comparable search sweep SIFT1M/10M"
description: >-
  Search-only comparison of DiskANN and SPANN on SIFT1M and SIFT10M with shared
  queries/ground truth, no batching, whole-machine resources, cold-start page
  cache, and per-family sweeps (DiskANN Ls vs SPANN internal_result_num) to
  produce comparable recall-vs-QPS curves.

data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 50

algorithms:
  # ----------------------------------------------------------------------------
  # SPANN (Microsoft SPTAG) — prebuilt indexes on both datasets
  # ----------------------------------------------------------------------------
  - name: "SPANN-sift1m"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift1m]
    build:
      timeout_seconds: 1200
      prebuilt_path: "SPANN/sift1m/internal-result-num-64_max-check-4096_num-thread-9a75424b"
    search:
      timeout_seconds: 1800
      k: 10
      batch_mode: false
      args:
        internal_result_num: 96
        posting_page_limit: 3
        num_threads: 8
      sweep:
        - {internal_result_num: 32}
        - {internal_result_num: 64}
        - {internal_result_num: 96}
        - {internal_result_num: 160}
        - {internal_result_num: 256}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0
        drop_caches_before: true

  - name: "SPANN-sift10m"
    docker_image: ann-suite/spann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      timeout_seconds: 1200
      prebuilt_path: "SPANN/sift10m/internal-result-num-64_max-check-4096_num-thread-9a75424b"
    search:
      timeout_seconds: 1800
      k: 10
      batch_mode: false
      args:
        internal_result_num: 96
        posting_page_limit: 3
        num_threads: 8
      sweep:
        - {internal_result_num: 32}
        - {internal_result_num: 64}
        - {internal_result_num: 96}
        - {internal_result_num: 160}
        - {internal_result_num: 256}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0
        drop_caches_before: true

  # ----------------------------------------------------------------------------
  # DiskANN (diskannpy) — sift1m uses existing uint8 prebuilt index
  # ----------------------------------------------------------------------------
  - name: "DiskANN-R32-Lb50-sift1m"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift1m]
    build:
      timeout_seconds: 600
      prebuilt_path: "DiskANN/sift1m-prebuilt/L-50_R-32_build-memory-maximum-0-27_index-prefix-c9390d63"
      args:
        R: 32
        L: 50
        num_threads: 8
    search:
      timeout_seconds: 7200
      k: 10
      batch_mode: false
      args:
        num_threads: 0
        index_prefix: ann
        vector_dtype: uint8
        num_nodes_to_cache: 0
        beam_width: 2
      sweep:
        - {Ls: 50}
        - {Ls: 100}
        - {Ls: 200}
        - {Ls: 400}
        - {Ls: 800}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0
        drop_caches_before: true

  # ----------------------------------------------------------------------------
  # DiskANN — sift10m has no prebuilt index, so build it once (R32/L50, float32)
  # ----------------------------------------------------------------------------
  - name: "DiskANN-R32-Lb50-sift10m"
    docker_image: ann-suite/diskann:latest
    algorithm_type: disk
    datasets: [sift10m]
    build:
      timeout_seconds: 14400
      reuse_index: true
      args:
        R: 32
        L: 50
        num_threads: 8
        build_memory_maximum: 3.0
        search_memory_maximum: 0.5
    search:
      timeout_seconds: 7200
      k: 10
      batch_mode: false
      args:
        num_threads: 0
        index_prefix: ann
        num_nodes_to_cache: 0
        beam_width: 2
      sweep:
        - {Ls: 50}
        - {Ls: 100}
        - {Ls: 200}
        - {Ls: 400}
        - {Ls: 800}
      warmup:
        collect_metrics: true
        cache_warmup_queries: 0
        drop_caches_before: true

datasets:
  - name: sift1m
    base_path: sift1m/base.npy
    query_path: sift1m/queries.npy
    ground_truth_path: sift1m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 1000000
    query_count: 10000

  - name: sift10m
    base_path: sift10m/base.npy
    query_path: sift10m/queries.npy
    ground_truth_path: sift10m/ground_truth.npy
    distance_metric: L2
    dimension: 128
    point_type: float32
    base_count: 10000000
    query_count: 10000