# Search-only companion to pipeann_bigann10m_degree_build.yaml: reuses the
# degree-sweep indices already built on the isfcr research host instead of
# rebuilding them (skips the build phase via build.prebuilt_path). These
# were migrated byte-for-byte from ~/data/idx/{bigann10m,bigann10m_R32,
# bigann10m_R128,bigann10m_R256} into indices/PipeANN/bigann-10m/ (see
# docs/RESEARCH_WORKFLOW.md); ~/data/idx/bigann10m* now symlink back here
# so the lead researcher's existing scripts keep working unchanged.
#
# required_files guards each entry against silently searching an
# incomplete/interrupted index (see BuildConfig.required_files docstring in
# src/ann_suite/core/schemas.py) - it checks for the on-disk index prefix
# actually used by these builds ("idx", not the "pipeann" prefix used by
# fresh builds elsewhere in this repo's example configs).
#
# R=512 is intentionally absent here too, for the same reason as in
# pipeann_bigann10m_degree_build.yaml: that build was aborted on isfcr and
# no bigann10m_R512 directory/index exists.

name: "PipeANN BIGANN-10M degree sweep (prebuilt)"
description: >
  Search-only reuse of the isfcr research host's R in {32,64,128,256}
  BIGANN-10M degree-sweep indices, prebuilt out-of-band.
data_dir: "./data"
results_dir: "./results"
index_dir: "./indices"
monitor_interval_ms: 200

algorithms:
  - name: PipeANN-R32-prebuilt
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 60
      prebuilt_path: "PipeANN/bigann-10m/R32_L128_pq32"
      required_files:
        - "idx_disk.index"
        - "idx_pq_pivots.bin"
        - "idx_pq_compressed.bin"
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: idx
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R64-prebuilt
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 60
      prebuilt_path: "PipeANN/bigann-10m/R64_L128_pq32"
      required_files:
        - "idx_disk.index"
        - "idx_pq_pivots.bin"
        - "idx_pq_compressed.bin"
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: idx
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R128-prebuilt
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 60
      prebuilt_path: "PipeANN/bigann-10m/R128_L192_pq32"
      required_files:
        - "idx_disk.index"
        - "idx_pq_pivots.bin"
        - "idx_pq_compressed.bin"
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: idx
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

  - name: PipeANN-R256-prebuilt
    docker_image: ann-suite/pipeann:latest
    algorithm_type: disk
    datasets: [bigann-10m]
    build:
      timeout_seconds: 60
      prebuilt_path: "PipeANN/bigann-10m/R256_L320_pq32"
      required_files:
        - "idx_disk.index"
        - "idx_pq_pivots.bin"
        - "idx_pq_compressed.bin"
    search:
      timeout_seconds: 60
      k: 10
      args:
        index_prefix: idx
        mode: 2
        beam_width: 32
        mem_L: 10
        Ls: 40
        num_threads: 8

datasets:
  - name: bigann-10m
    base_path: bigann-10m/base10m.u8bin
    query_path: bigann-10m/query.u8bin
    ground_truth_path: bigann-10m/gt10m.bin
    distance_metric: L2
    dimension: 128
    point_type: uint8
    base_count: 10000000
    query_count: 10000
